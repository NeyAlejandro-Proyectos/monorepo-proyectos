# ============================================================
# application.properties
# Configuracion principal del backend para el taller escolar
# ============================================================

# --- Servidor ---
server.port=8080
server.forward-headers-strategy=framework

# --- Fuente de datos H2 (persistente en disco) ---
# Se puede definir TALLER_DB_PATH para usar una ruta absoluta fuera del proyecto.
spring.datasource.url=jdbc:h2:file:${TALLER_DB_PATH:./data/tallerdb};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" crea las tablas automaticamente si no existen y las actualiza si cambia el modelo
spring.jpa.hibernate.ddl-auto=update
# Ejecuta data.sql despues de que Hibernate cree o actualice las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Muestra en consola las consultas SQL generadas (util para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Consola web de H2 ---
# Acceder en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite conexiones desde el navegador (necesario en Spring Security si se agrega luego)
spring.h2.console.settings.web-allow-others=true
